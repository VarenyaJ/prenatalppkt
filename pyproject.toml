[build-system]
requires = ["setuptools==84.0.0", "setuptools_scm==8.3.1", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "prenatalppkt"
description = "Prenatal phenopacket library"
authors = [
  { name = "Varenya Jain" },
  { name = "Peter N. Robinson" },
]
requires-python = ">=3.10"
# dynamic = ["dependencies", "version"]
dynamic = ["version"]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# inherited from requirements/requirements.txt and requirements/requirements_test.txt
dependencies = [
 "click==8.3.3",
 #"hpo-toolkit==0.7.0",
 "hpo-toolkit==0.5.5",
 "ijson==3.4.0",
 "jsonschema==4.25.1",
 "openpyxl==3.1.5",
 "orjson==3.11.9",
 "pandas==2.3.2",
 "phenopackets==2.0.2.post5",
 "protobuf==6.33.6",
 "python-calamine==0.5.3",
 "PyYAML==6.0.2",
 "requests==2.34.2",
 "rich==14.1.0",
 "stairval==0.2.1",
 #"typer==0.17.4",
 "fenominal==0.3.4",
]

[project.optional-dependencies]
dev = [
 "pytest==9.0.3",
 "ruff==0.12.4",
 "ipykernel",
 "pre-commit>=3.7",
]
ocr = [
 "docling==2.142.1; python_full_version >= '3.11'", # pulls in torch/CUDA (~3GB)
 "docling==2.138.0; python_full_version < '3.11'", # pillow 13 needs Python 3.11 or newer
]
fast_hpo_cr = [
 "FastHPOCR==0.1.4",
 "pronto==2.7.3", # FastHPOCR's own PyPI release omits this real runtime dependency (requires_dist is empty)
]
ferrific = [
 "ferrific==0.2.1",
]
docs = [
    "sphinx>=7.4,<9",
    "myst-parser>=3.0,<5",
    "sphinx-rtd-theme>=1.3,<4",
    "sphinx-autodoc-typehints>=2.2,<4",
    "sphinx-copybutton>=0.5,<1",
    "linkify-it-py>=2.0,<3",
]

[project.urls]
homepage = "https://github.com/VarenyaJ/prenatalppkt/"
repository = "https://github.com/VarenyaJ/prenatalppkt/.git"
documentation = "https://github.com/VarenyaJ/prenatalppkt/"
bugtracker = "https://github.com/VarenyaJ/prenatalppkt/issues"

[project.scripts]
prenatalppkt = "prenatalppkt.cli:main"


[tool.setuptools]
packages.find = { where = ["src"] }

[tool.setuptools.package-data]
prenatalppkt = ["data/mappings/*.yaml", "data/mappings/README.md"]

[tool.setuptools_scm]
version_file = "src/prenatalppkt/_version.py"

[tool.setuptools.dynamic]
version = { attr = "prenatalppkt._version.version" }
# dependencies = {file = ["requirements/requirements.txt"]}

[tool.uv]
# Only resolve releases at least two weeks old; move this date forward on
# purpose when updating the lockfile.
exclude-newer = "2026-10-14T00:00:00Z"
# Security fixes newer than the cutoff, allowed on purpose (2026-10-28):
# certifi (emSign CA removal), virtualenv / filelock / setuptools (dev-tool advisories).
# OCR extra: pillow 13.0.0 (image-parsing advisories) needs docling 2.142.1 and the docling
# packages that first allow pillow 13 (docling-core 2.104.0, docling-ibm-models 4.0.4,
# docling-parse 7.23.0, doclang 0.8.0). soupsieve 4.0 fixes an HTML parser advisory.
# Each one is newer than the cutoff above, within the two-week rule.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", virtualenv = "2026-10-21T00:00:00Z", filelock = "2026-10-21T00:00:00Z", setuptools = "2026-10-21T00:00:00Z", pillow = "2026-10-17T00:00:00Z", docling = "2026-10-24T00:00:00Z", docling-slim = "2026-10-24T00:00:00Z", docling-core = "2026-10-24T00:00:00Z", docling-ibm-models = "2026-10-24T00:00:00Z", docling-parse = "2026-10-24T00:00:00Z", doclang = "2026-10-16T00:00:00Z", soupsieve = "2026-11-04T00:00:00Z" }

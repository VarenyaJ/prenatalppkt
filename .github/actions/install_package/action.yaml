name: Install a Python Package
description: 'Installs a specified Python package from a requirements file, allowing for flexible package management.'

inputs:
    requirements-path:
        required: true
        description: Path to the requirements file
    package:
        required: true
        description: Package you would like to install from the requirements file

runs:
    using: composite
    steps:
        -   name: Extract Package Version
            id: extract_package_version
            shell: bash
            env:
                PACKAGE: ${{ inputs.package }}
                REQUIREMENTS_PATH: ${{ inputs.requirements-path }}
            run: |
                echo "PACKAGE_LINE=$(grep -w "^${PACKAGE}" "$REQUIREMENTS_PATH" || echo "$PACKAGE")" >> "$GITHUB_OUTPUT"

        -   name: Install Package
            shell: bash
            env:
                PACKAGE_LINE: ${{ steps.extract_package_version.outputs.PACKAGE_LINE }}
            run: |
                python -m pip install --upgrade pip
                pip install "$PACKAGE_LINE"
name: Create Master Cache

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

permissions:
      contents: read

env:
    PYTEST_ADDOPTS: "--color=yes"

jobs:
  create_master_cache:
    name: Caching
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:

    - name: Check out Repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
       fetch-depth: 0

    - name: Setup Env
      uses: ./.github/actions/setup_env
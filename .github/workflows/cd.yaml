name: CD

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-to-pypi:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Check out Repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup Python from pyproject.toml
      uses: ./.github/actions/python_from_pyproject

    - name: Install build
      run: >-
        pip install build==1.2.2.post1

    - name: Build a binary wheel and a source tarball
      run: python3 -m build

    - name: Publish distribution 📦 to PyPI
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
      with:
        packages-dir: dist/
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
name: CI

on:
  pull_request:

permissions:
      contents: read

env:
    PYTEST_ADDOPTS: "--color=yes"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:

    - name: Check out Repo
      uses: actions/checkout@v4
      with:
       fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install the locked environment
      run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

    - name: Test with pytest
      id: tests
      run: uv run --frozen pytest --disable-warnings ./

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Ruff Formatting
      uses: astral-sh/ruff-action@v3.5.0
      with:
        version-file: "requirements/requirements_test.txt"
        args: "format --check"


  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Ruff Linting
      uses: astral-sh/ruff-action@v3.5.0
      with:
        version-file: "requirements/requirements_test.txt"